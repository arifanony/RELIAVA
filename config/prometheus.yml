global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo
    static_configs:
      - targets: ["demo:8000"]
  - job_name: ai-sre-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
